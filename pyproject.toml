[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantengine-public"
dynamic = ["version"]
description = "Evidence-controlled AI software delivery with a QuantEngine reference runtime."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Derrick Xu"}
]
dependencies = [
  "openai-agents==0.22.0",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.0",
  "pytest>=8.0"
]

[project.scripts]
quantengine-public = "quantengine_public.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "quantengine_public.__version__"}

[tool.setuptools.package-data]
quantengine_public = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
