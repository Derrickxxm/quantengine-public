name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --constraint constraints/ci.txt pip setuptools wheel
      - run: python -m pip install --constraint constraints/ci.txt --no-build-isolation -e ".[dev]"
      - run: python scripts/release_smoke.py
      - run: python scripts/public_safety_scan.py
      - run: python scripts/run_hosted_phase2.py
      - run: python -m coverage run --branch --source=src/quantengine_public -m pytest
      - run: python -m coverage report --skip-covered --fail-under=82
      - run: quantengine-public demo --artifact-dir artifacts/ci-demo
      - run: quantengine-public validate --artifact-dir artifacts/ci-demo
      - run: quantengine-public demo-v2 --artifact-dir artifacts/ci-demo-v2
      - run: python -m quantengine_public.delivery.golden_path --artifact-dir artifacts/ci-golden-path
      - run: python scripts/native_agent_public_proof.py --artifact-dir artifacts/native-agent-public-proof
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.11'
        with:
          name: public-golden-path-evidence
          path: artifacts/ci-golden-path
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.11'
        with:
          name: native-agent-public-proof
          path: artifacts/native-agent-public-proof
