name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/release_smoke.py
      - run: python scripts/public_safety_scan.py
      - run: pytest
      - run: quantengine-public demo --artifact-dir artifacts/ci-demo
      - run: quantengine-public validate --artifact-dir artifacts/ci-demo
      - run: quantengine-public demo-v2 --artifact-dir artifacts/ci-demo-v2
      - run: python -m quantengine_public.delivery.golden_path --artifact-dir artifacts/ci-golden-path
      - uses: actions/upload-artifact@v4
        with:
          name: public-golden-path-evidence
          path: artifacts/ci-golden-path
